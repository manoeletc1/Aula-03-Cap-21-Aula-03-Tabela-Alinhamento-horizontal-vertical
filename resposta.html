<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento em Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            /* Alinhamento padrão */
            text-align: center;      
            vertical-align: middle;  
        }
        .direita {
    text-align: right;
        }
        .esquerda {
    text-align: left;
        }
    .topo {
    vertical-align: top;
}
    .baixo {
    vertical-align: bottom;
}
    .linha-alta {
    height: 400px;
}


        /* 
        ================================
        TAREFA 1: ALINHAMENTO HORIZONTAL
        - Crie uma classe .direita para alinhar o texto à direita
        - Crie uma classe .esquerda para alinhar o texto à esquerda
        - Aplique essas classes em células diferentes
        ================================
        */

        /* 
        ================================
        TAREFA 2: ALINHAMENTO VERTICAL
        - Crie uma classe .topo para alinhar o texto no topo
        - Crie uma classe .baixo para alinhar o texto na parte de baixo
        - Aplique em células da segunda e terceira linha
        ================================
        */

        /* 
        ================================
        TAREFA 3: DESAFIO EXTRA
        - Aumente a altura de uma das linhas da tabela (ex: height: 100px;)
        - Coloque um número em uma célula e alinhe-o à direita
        ================================
        */
    </style>
</head>
<body>
    <h1>Trabalhando com alinhamento</h1>
    
    <table>
        <tr style="width: 40px; height: 40px;"> <!-- Primeira linha -->
            <td class="esquerda">A1</td>
            <td>B1</td>
            <td class="direita">C1</td>
        </tr>
        <tr> <!-- Segunda linha -->
            <td class="topo">A2</td>
            <td>B2</td>
            <td class="baixo">C2</td>
        </tr>
        <tr class="linha-alta"> <!-- Terceira linha -->
            <td class="topo">A3</td>
            <td class="baixo">B3</td>
            <td>C3</td>
        </tr>
        <tr style="width: 40px; height: 40px;"> <!-- Quarta linha -->
            <td>A4</td>
            <td class="direita">1000</td>
            <td>C4</td>
        </tr>
    </table>
    
</body>
</html>
